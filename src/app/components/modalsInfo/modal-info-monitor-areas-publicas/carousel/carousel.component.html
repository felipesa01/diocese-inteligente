<ngb-carousel [activeId]="activated" #carousel [showNavigationArrows]="showNavigationArrows">
    <ng-template *ngFor="let item of carouselObject.data;let n=index" id="slideId-{{n}}" ngbSlide>
        <div class="picsum-img-wrapper" >
            <img [src]="objUrls[item.ID_Arquivo]" alt="Random first slide"/>
        </div>  
        <div class="carousel-caption">
            <h3>{{item.NM_Arquivo}}</h3>
        </div>
        <!-- <div class="footer">
            <p>Teste</p>
        </div> -->
    </ng-template>

</ngb-carousel>

<div class="row align-items-center" style="margin: 0;">
    <div class="col-auto me-auto form-switch" style="padding-right: 0px;">
        <input class="form-check-input" type="checkbox" [id]="id" style="cursor: pointer;" [name]="name"
            [(ngModel)]="isVisible" (ngModelChange)="apply($event)">
    </div>

    <div class="col p-0">
        <div class="d-flex align-items-center">
            <label class="form-check-label" style="font-weight: 500;" [for]="id">{{name}}</label>

            <div class="me-auto"></div>

            <div class="d-flex align-items-center mx-1">
                <button *ngIf="isFiltred" class="btn p-0 btn-edit" style="border-radius: 1em;"
                    matTooltip="Camada com filtro aplicado" (click)="openSearchOrFilterModal('filter')">
                    <i class="material-icons"
                        style="color: #ffc107; font-size: 0.7em; border-radius: 1em; border: solid 2px;">filter_alt</i>
                </button>

                <!-- Div para encapsular o botão. Para funcionar o tooltip quando ele tiver desativado -->
                <div matTooltipShowDelay="500" [matTooltip]="!initClicavel ? 'Camada sem informações disponíveis ao clicar no mapa' : (item.layer.get('clicavel') ? 'Desative para não exibir informações da camada ao clicar no mapa' : 'Ative para exibir informações da camada ao clicar no mapa')" >
                    <button tool [disabled]="!initClicavel" (click)="toggleLayerClickable()" class="btn p-0 d-flex btn-edit" style="border-radius: 1em;">
                    <i class="material-icons-outlined" style="font-size: 1em; border-radius: 1em;" [ngStyle]="{'color': item.layer.get('clicavel') ? '#0d6efd' : '#a1a1a1'}">info</i>
                </button>
                </div>

            </div>

        </div>
    </div>

    <div class="col-auto p-0">
        <button type="button" #openButton="matMenuTrigger" [matMenuTriggerFor]="menu"
            class="btn btn-outline-light btn-edit" matTooltip="Opções" matTooltipPosition="right">
            <i class="material-icons notranslate" style="font-size: 20px;width: 20px; color: #adadad;">
                more_vert
            </i>
        </button>

    </div>

    <mat-menu id="menu-layer-option" #menu="matMenu" xPosition="after">
        <span (mouseleave)="closeMenu()">

            <button *ngFor="let button of buttonList" mat-menu-item (click)="button.func()"
                [disabled]="!getFunctionActivation(button.id)">
                <div class="d-flex align-items-center">
                    <i class="material-icons-outlined btn-icon" style="font-size: 1.2em;">{{button.icon}}</i>
                    <span style="font-size: 0.9em;">{{button.name}}</span>
                    <!-- <div *ngIf="button.innerHTML" [innerHTML]="button.innerHTML"></div> -->
                </div>
            </button>
            <hr>
            <button mat-menu-item (click)="removeLayer()">
                <div class="d-flex align-items-center">
                    <i class="material-icons-outlined btn-icon" style="font-size: 1.2em;">delete</i>
                    <span style="font-size: 0.9em;">Remover</span>
                </div>
            </button>

        </span>

    </mat-menu>

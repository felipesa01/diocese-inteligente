<div *ngIf="idSelected">
    <div class="border rounded  bg-body-tertiary" style="background-color: #e3e3e3;">
        <div class="d-flex justify-content-center align-items-center p-2">
            <div class="position-relative d-flex" style="width: 100%;">

                <select class="form-select form-select-sm me-1" (change)="onChange()" style="width: 30%;"
                    [(ngModel)]="idSelected">
                    <option *ngFor="let option of optionsToSearch; let n=index" [value]="option.id">{{option.layerName}}
                    </option>
                </select>

                <div class="position-relative w-100">
                    <input #input class="form-control notranslate" type="text"
                        [placeholder]="optionSelected?.placeholder" style="font-size: 0.9em;" [(ngModel)]="searchWord"
                        (keyup)="onKeyup($event)" />

                    <button *ngIf="searchWord" type="button" class="btn bg-transparent btn-sm p-0 position-absolute"
                        style="right: 4px; top: 50%; transform: translateY(-50%);" (click)="clearSearch()">
                        <i style="font-size: 1.2em;" class="material-icons">close</i>
                    </button>
                </div>
            </div>
            <div>
                <button type="button" class="btn btn-primary btn-sm ms-1" (click)="doSearch_beta()"
                    style="width: 62px; height: 30px;">

                    <ng-container *ngIf="isLoading; else bucarTitle">
                        <div class="d-flex justify-content-center notranslate">
                            <div class="spinner-border text-light spinner-border-sm" role="status">
                            </div>
                        </div>
                    </ng-container>

                    <ng-template #bucarTitle>
                        <span class="notranslate">Buscar</span>
                    </ng-template>
                </button>
            </div>
        </div>

        <div aria-live="polite" toastContainer style="line-height: normal;"></div>

    </div>

    <div *ngIf="tableData" class="border rounded bg-body-tertiary" style="background-color: #e3e3e3; overflow: auto;">
        <div class="table-responsive" style="max-height: 100%; font-size: 0.95em; max-height: 100%;">
            <table class="table table-responsive-xl table-sm table-hover">
                <thead>
                    <tr class="lh-1">
                        <th *ngFor="let colName of tableHeader" scope="col" style="min-width: 100px;">
                            {{colNames[colName]}}
                        </th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let row of tableData" (click)="onTableClick(row['obj'])">
                        <td scope="row" *ngFor="let colName of tableHeader"
                            [matTooltip]="getMatTooltip(row.properties[colName], 18)" matTooltipPosition="right">
                            {{row.properties[colName] | formatarValores:{fillTerm: '-', limit: 18} }}</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

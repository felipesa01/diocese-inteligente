<h2 mat-dialog-title>Nossos Serviços</h2>

<mat-dialog-content>
  <div class="cards-container">
    <mat-card *ngFor="let card of cards" class="card" [style.border-top-color]="card.color" >
      <mat-card-header>
        <div mat-card-avatar class="card-icon" [style.backgroundColor]="card.color + '20'">
          <mat-icon [style.color]="card.color">{{ card.icon }}</mat-icon>
        </div>
        <mat-card-title>{{ card.title }}</mat-card-title>
      </mat-card-header>
      
      <mat-card-content>
        <p>{{ card.description }}</p>
      </mat-card-content>
    </mat-card>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="close()">Fechar</button>
</mat-dialog-actions>
